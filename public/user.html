<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Modern Dark | Posts</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <nav class="navbar">

        <div class="brand">
            ⚡ Modern Dark
        </div>

        <div class="nav-right">

            <span id="username">
                User
            </span>

            <button
                onclick="logout()"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </nav>

    <main class="user-main">

        <section class="hero">

            <p class="hero-label">
                LATEST POSTS
            </p>

            <h1>
                Discover Something New.
            </h1>

            <p>
                Explore the latest posts and updates.
            </p>

        </section>

        <section>

            <div
                id="postsContainer"
                class="posts-grid"
            ></div>

        </section>

    </main>

    <script src="user.js"></script>

</body>

</html>
